<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaserCircuit</title>
  <link rel="stylesheet" href="./css/index.css" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=home,replay" />
  <script src="./ts/game.ts" defer></script>
  <style>
    .material-symbols-rounded {
      font-variation-settings:
        'FILL' 1,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
    }
  </style>
</head>

<body>
  <header>
    <div class="box">
      <h1 class="g-title">LaserCircuit</h1>
      <p class="g-description">Aim colored light through mirrors and splitters</p>
    </div>
  </header>
  <section id="title-screen" class="screen space">
    <div class="placeholder">
      <img class="icon" src="./css/maze.png" alt="LaserRay" />
    </div>
    <div class="button-box">
      <button class="btn-bold btn-tertiary large" id="btn-play">
        Start Puzzle
      </button>
      <a class="btn-bold btn-basic large" href="https://stardance.hackclub.com/projects/45734">
        View Stardance
      </a>
    </div>
  </section>
  <section id="level-screen" class="hidden screen">

  </section>
  <main id="game-screen" class="hidden screen">
    <h1><span id="lvl-id">1.1</span> <span id="lvl-title">Circuit</span></h1>
    <p id="status">Loading level...</p>
    <div class="complete-container">
      <button class="btn-bold btn-secondary hidden" id="complete-level-btn" type="button">Complete Level</button>
    </div>
    <dialog id="completion-dialog" class="completion-dialog">
      <div class="dialog-content">
        <h2 class="dialog-title">Level Complete!</h2>

        <div class="dialog-stats">
          <div class="stat-row">
            <span>Time:</span>
            <strong id="completion-current-time">00:00.00</strong>
          </div>
          <div class="stat-row">
            <span>Highscore:</span>
            <strong id="completion-best-time">00:00.00</strong>
          </div>
          <div id="completion-new-record" class="new-record-banner hidden">
            ★ NEW BEST TIME! ★
          </div>
        </div>

        <!-- Action buttons below stats -->
        <div class="dialog-actions">
          <button id="completion-btn-menu" class="btn-bold btn-primary">
            <span class="material-symbols-rounded">home</span>
          </button>
          <button id="completion-btn-retry" class="btn-bold btn-primary">
            <span class="material-symbols-rounded">replay</span>
          </button>
          <button id="completion-btn-finish" class="btn-bold btn-secondary">Next Level</button>
        </div>
      </div>
    </dialog>
  </main>
  <footer>© Jonas Gaden / 2026</footer>
</body>

</html>
