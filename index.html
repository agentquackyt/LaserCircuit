<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laser Circuit</title>
  <link rel="stylesheet" href="./css/index.css" />
  <script src="./ts/game.ts" defer></script>
</head>

<body>
  <header>
    <div class="box">
      <h1 class="g-title">Laser Circuit</h1>
      <p class="g-description">Aim colored light through mirrors, splitters, and adders.</p>
    </div>
    <div class="box highscore-box">
      <a href="https://stardance.hackclub.com/projects/45734" class="btn-bold btn-basic small">View Stardance</a>
    </div>
  </header>
  <section id="title-screen" class="screen space">
    <div class="placeholder">
      <img class="icon" src="./css/maze.png" alt="LaserRay" />
    </div>
    <div class="button-box">
      <button class="btn-bold btn-tertiary large" id="g-btn-start">
        Start Puzzle
      </button>
      <a class="btn-bold btn-basic large" href="https://stardance.hackclub.com/projects/45734">
        View Stardance
      </a>
    </div>

  </section>
  <section id="level-screen" class="hidden screen">

  </section>
  <main id="game-screen" class="hidden screen">
    <h1>Laser Circuit</h1>
    <p id="status">Loading level...</p>
    <button class="btn-bold btn-secondary hidden" id="complete-level-btn" type="button">
      Complete Level
    </button>
    <dialog id="completion-dialog">
      <h2>Level complete</h2>
      <p>You completed this level in <strong id="completion-time">0</strong> seconds.</p>
      <form method="dialog">
        <button class="btn-bold btn-basic" type="submit">Share</button>
        <button class="btn-bold btn-secondary" type="submit">Change Level</button>
      </form>
    </dialog>
  </main>
  <footer>© Jonas Gaden / 2026</footer>
</body>

</html>
